[project]
name = "mosaic"
version = "0.1.0"
description = "Mosaic: a wide-domain System 1 typed-decision model with MoE routing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "accelerate>=0.33",
    "datasets>=2.20",
    "einops>=0.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "omegaconf>=2.3",
    "requests>=2.32",
    "pandas>=2.2",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]
